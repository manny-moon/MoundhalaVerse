name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Types, schemas and the full suite. Deploy depends on this, so master can
  # only publish something that passed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs `astro check` first, so a type error or a content
      # file that fails its schema fails here rather than shipping.
      - run: npm run build

      # Only Chromium, and only its own dependencies: the suite runs one
      # project, so pulling the other engines would be dead weight in CI.
      - run: npx playwright install --with-deps chromium

      - run: npm test
        env:
          CI: 'true'

      # Traces and screenshots for whatever failed, kept long enough to debug.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Derives the Pages origin and base path from the repo, so this keeps
      # working if the repo is renamed or a custom domain is attached.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

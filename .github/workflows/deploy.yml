name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Derives the Pages origin and base path from the repo, so this keeps
      # working if the repo is renamed or a custom domain is attached.
      - id: pages
        uses: actions/configure-pages@v5

      # `npm run build` runs `astro check` first, so a type error or a content
      # file that fails its schema fails the deploy instead of shipping.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
